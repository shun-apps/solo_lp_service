<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>お申し込み・お問い合わせ</title>
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/theme-handmade.css">
<link rel="stylesheet" href="/demo-journey.css">
<link rel="stylesheet" href="/delivery/public-form.css">
<script type="module" src="/delivery/public-form.mjs"></script>
</head>
<body>
<main class="public-wrap">
  <section class="public-card">
    <span class="eyebrow">APPLICATION FORM</span>
    <h1 id="form-title">受付フォーム</h1>
    <div class="guide-band" id="form-notice">入力内容をご確認ください。</div>
    <div class="progress" aria-hidden="true"><span id="progress-bar"></span></div>
    <p id="progress-label" class="subtle">1 / 4</p>
    <form id="form" novalidate>
      <section id="step-0">
        <h2 id="type-heading">お申し込み内容</h2>
        <div id="choices" class="public-options"></div>
        <div id="attendee-row" class="public-field" hidden>
          <label for="attendees">参加人数</label>
          <input id="attendees" class="field" type="number" min="1" max="20" value="1" inputmode="numeric">
        </div>
      </section>
      <section id="step-1" hidden>
        <div class="public-field"><label for="customer-name">お名前</label><input id="customer-name" class="field" type="text" maxlength="80" autocomplete="name" required></div>
      </section>
      <section id="step-2" hidden>
        <div class="public-field"><label for="customer-email">メールアドレス</label><input id="customer-email" class="field" type="email" maxlength="254" autocomplete="email" required></div>
      </section>
      <section id="step-3" hidden>
        <h2>入力内容の確認</h2>
        <dl id="review" class="review"></dl>
      </section>
      <section id="step-4" hidden>
        <h2>受付が完了しました</h2>
        <p>お申し込み・お問い合わせを受け付けました。</p>
        <p>メール通知は現在準備中です。必要なご案内はショップから行います。</p>
      </section>
      <p id="error" class="public-error" role="alert" aria-live="polite"></p>
      <div class="public-actions" id="actions">
        <button type="button" class="btn btn-outline" id="back" hidden>戻る</button>
        <button type="button" class="btn btn-primary" id="next">次へ</button>
        <button type="submit" class="btn btn-primary" id="submit" hidden>申し込む</button>
      </div>
    </form>
  </section>
</main>
</body>
</html>
